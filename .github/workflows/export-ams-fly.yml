name: Export AMS Fly package

on:
  push:
    branches: [main]

jobs:
  export:
    if: !contains(github.event.head_commit.message, '[skip export]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated AMS Fly package
        run: |
          rm -rf export
          mkdir -p export/AMS-Fly/neon
          cp juegos/ams-fly/README.md export/AMS-Fly/
          cp juegos/ams-fly/index.html export/AMS-Fly/
          cp juegos/ams-fly/game.js export/AMS-Fly/
          cp juegos/ams-fly/styles.css export/AMS-Fly/
          cp juegos/ams-fly/sw.js export/AMS-Fly/
          cp juegos/ams-fly/neon-client.js export/AMS-Fly/
          cp juegos/ams-fly/neon-config.js export/AMS-Fly/
          cp juegos/ams-fly/manifest.webmanifest export/AMS-Fly/
          cp juegos/ams-fly/privacidad.html export/AMS-Fly/
          cp juegos/ams-fly/terminos.html export/AMS-Fly/
          cp juegos/ams-fly/robots.txt export/AMS-Fly/
          cp juegos/ams-fly/sitemap.xml export/AMS-Fly/
          cp juegos/ams-fly/*.svg export/AMS-Fly/
          cp juegos/ams-fly/diagnostico.html export/AMS-Fly/
          cp -R juegos/ams-fly/neon/. export/AMS-Fly/neon/
          cat > export/AMS-Fly/ENTREGA-OTRA-IA.md <<'EOF'
# AMS Fly — paquete aislado para reparación

Este paquete corresponde EXCLUSIVAMENTE a juegos/ams-fly/ del repositorio AMS.

## Regla principal
No modificar ni depender de ningún otro juego de AMS. Todo cambio del juego debe quedar dentro de esta carpeta.

## Objetivo
Dejar AMS Fly completamente funcional de extremo a extremo:
- Neon Auth: registro, inicio/cierre de sesión y sesión persistente.
- Perfil: nombre, apellido, celular, país y ave.
- Selección real de cualquiera de las 10 aves.
- Evento y aceptación de T&C vinculada a la cuenta.
- Juego, pausa, reinicio y sonidos.
- Resultado final y publicación.
- Ranking mundial.
- Persistencia Neon y fallback local sin ocultar errores reales.
- Responsive móvil/tablet/escritorio sin bloquear tablets.
- Durante la pantalla activa del juego no debe existir encabezado superior.
- Las aves deben verse completas en selector, resultado y ranking.

## Estado conocido
La interfaz ha mostrado el mensaje de que los datos se guardaron localmente pero no pudieron sincronizarse con Neon. Esto debe investigarse y resolverse, no simplemente ocultarse.

## Neon
neon/rls-migration.sql debe existir y quedar alineado con el frontend. No inventar endpoints ni credenciales. Las URL públicas están en neon-config.js; no hay secretos en este paquete.

## Importante
control-ams/ NO forma parte de este paquete público. No reintroducir administración interna dentro del juego público.

## Archivos principales
- index.html
- game.js
- styles.css
- sw.js
- neon-client.js
- neon-config.js
- neon/schema.sql
- neon/rls-migration.sql
- diagnostico.html

La IA que reciba este paquete debe probar primero el flujo real completo antes de declarar el juego terminado.
EOF
          cd export
          zip -r ../AMS-Fly-aislado.zip AMS-Fly
          mkdir -p ../export-chunks
          base64 -w 0 ../AMS-Fly-aislado.zip > ../export-chunks/ams-fly.zip.b64
          split -b 900k ../export-chunks/ams-fly.zip.b64 ../export-chunks/part-
          rm ../export-chunks/ams-fly.zip.b64
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .ams-fly-export
          mkdir .ams-fly-export
          cp export-chunks/part-* .ams-fly-export/
          printf '%s\n' 'AMS Fly isolated export chunks. Reassemble in lexical order, concatenate, base64-decode.' > .ams-fly-export/README.txt
          git add .ams-fly-export
          git commit -m '[skip export] Add AMS Fly isolated export chunks' || true
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: AMS-Fly-aislado
          path: AMS-Fly-aislado.zip
