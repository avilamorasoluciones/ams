<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="192" height="192" role="img" aria-labelledby="title desc">
<title id="title">Avila Mora Soluciones — Isotipo AMS</title>
<desc id="desc">Monograma integrado A, M y S en una sola composición geométrica.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#07061a"/><stop offset=".5" stop-color="#151034"/><stop offset="1" stop-color="#090717"/>
  </linearGradient>
  <linearGradient id="amsA" x1="0" y1="1" x2="1" y2="0">
    <stop stop-color="#6d43ff"/><stop offset=".48" stop-color="#9b5cff"/><stop offset="1" stop-color="#d946ef"/>
  </linearGradient>
  <linearGradient id="amsM" x1="0" y1="1" x2="1" y2=".15">
    <stop stop-color="#4b35e8"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f0a5ff"/>
  </linearGradient>
  <linearGradient id="amsS" x1="0" y1=".2" x2="1" y2=".85">
    <stop stop-color="#b05cff"/><stop offset=".38" stop-color="#d54ce9"/><stop offset=".72" stop-color="#ff4eb9"/><stop offset="1" stop-color="#ff73c8"/>
  </linearGradient>
  <linearGradient id="orbit" x1="0" y1=".2" x2="1" y2=".8">
    <stop stop-color="#6d43ff" stop-opacity=".18"/><stop offset=".52" stop-color="#ff4eb9" stop-opacity=".28"/><stop offset="1" stop-color="#6d43ff" stop-opacity=".08"/>
  </linearGradient>
  <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect x="18" y="18" width="476" height="476" rx="112" fill="url(#bg)"/>
<circle cx="256" cy="256" r="192" fill="none" stroke="url(#orbit)" stroke-width="2"/>
<circle cx="256" cy="256" r="214" fill="none" stroke="url(#orbit)" stroke-width="1" opacity=".7"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
  <!-- A -->
  <path d="M118 376 L223 154 Q231 137 247 137 H273 L394 376" stroke="url(#amsA)" stroke-width="32"/>
  <path d="M165 292 H334" stroke="url(#amsA)" stroke-width="28"/>
  <!-- M -->
  <path d="M148 364 L205 230 L256 322 L307 230 L364 364" stroke="url(#amsM)" stroke-width="28"/>
  <!-- S -->
  <path d="M388 183 C350 155 292 153 254 171 C220 187 219 225 252 241
           C284 257 333 250 350 277 C369 307 339 342 294 357
           C247 372 187 357 151 332" stroke="url(#amsS)" stroke-width="25"/>
</g>
<!-- Subtle continuous highlight -->
<path d="M151 332 C190 352 243 361 292 346 C336 332 362 306 347 281
         C332 256 286 257 252 241 C219 225 221 188 254 171"
      fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="4" stroke-linecap="round"/>
<g filter="url(#glow)">
  <circle cx="104" cy="150" r="5" fill="#7b5cff"/><circle cx="404" cy="148" r="5" fill="#ff57bb"/>
  <circle cx="95" cy="386" r="3.5" fill="#b66cff"/><circle cx="420" cy="378" r="3.5" fill="#f56bc5"/>
</g>
</svg>