<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#02040b"/><stop offset=".58" stop-color="#07132d"/><stop offset="1" stop-color="#12051b"/>
    </linearGradient>
    <linearGradient id="sym" x1="0" y1="0.1" x2="1" y2=".9">
      <stop stop-color="#55e8ff"/><stop offset=".28" stop-color="#2469ff"/><stop offset=".58" stop-color="#7957ff"/><stop offset=".82" stop-color="#ef43dd"/><stop offset="1" stop-color="#ff84cf"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2ddcff"/><stop offset=".45" stop-color="#6a6cff"/><stop offset=".73" stop-color="#f149e8"/><stop offset="1" stop-color="#30e0c3"/>
    </linearGradient>
    <filter id="softGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tinyGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="7" y="7" width="498" height="498" rx="112" fill="url(#bg)"/>

  <!-- Orbital identity -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="url(#edge)" stroke-width="2" opacity=".18"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="url(#edge)" stroke-width="1.2" opacity=".11"/>
  <path d="M86 300 A190 190 0 0 1 424 243" fill="none" stroke="url(#edge)" stroke-width="3" opacity=".55"/>
  <path d="M98 190 A188 188 0 0 0 420 338" fill="none" stroke="url(#edge)" stroke-width="1.5" opacity=".25"/>

  <!-- Abstract symbol: three flowing planes form a single recognizable tech mark,
       with no letters or text. -->
  <g filter="url(#softGlow)">
    <path d="M116 356 L214 156 Q220 144 232 144 L260 144 L191 304 L147 383 Q141 395 126 395 L111 395 Z"
          fill="url(#sym)"/>
    <path d="M232 144 L395 144 L342 224 L274 224 L232 188 Z" fill="url(#sym)" opacity=".96"/>
    <path d="M196 302 Q256 267 318 258 Q371 250 427 292 L405 325 Q346 293 299 306 Q247 319 197 351 L150 382 Q143 388 134 382 Z"
          fill="url(#edge)"/>
    <path d="M300 306 Q359 292 427 328 L399 370 Q347 337 300 341 L246 350 Q218 355 194 370 L170 348 Q228 311 300 306 Z"
          fill="url(#sym)" opacity=".93"/>
  </g>

  <!-- Small orbital nodes -->
  <g filter="url(#tinyGlow)">
    <circle cx="77" cy="157" r="5.5" fill="#2ddcff"/>
    <circle cx="432" cy="160" r="5.5" fill="#ff4cc1"/>
    <circle cx="111" cy="409" r="3.8" fill="#7269ff"/>
    <circle cx="406" cy="399" r="3.8" fill="#30e0c3"/>
  </g>
</svg>