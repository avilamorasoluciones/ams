    <circle cx="428" cy="155" r="5.5" fill="#ff4fc1"/>
    <circle cx="118" cy="404" r="3.6" fill="#7c6dff"/>
    <circle cx="398" cy="405" r="3.6" fill="#20dfbf"/>
