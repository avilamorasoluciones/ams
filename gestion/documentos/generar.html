x;color:#7b8494;font-size:8px;line-height:1.55}

<main class="wrap">
<section class="intro"><div class="eyebrow">DOCUMENTO PERSONALIZADO</div><h1 id="pageTitle">Generar documento</h1><p id="pageSub">Elige un cliente, un servicio y completa únicamente los datos propios de este documento. Las plantillas se adaptan al caso.</p></section>

<script>
const $=id=>document.getElementById(id), qs=(s,r=document)=>r.querySelector(s), qsa=(s,r=document)=>[...r.querySelectorAll(s)];
const TYPE_NAMES={propuesta:"Propuesta comercial / cotización",recibo:"Comprobante de pago",ficha:"Ficha de cliente / proyecto",acta:"Acta de entrega"};
const TYPE_SUB={propuesta:"Propuesta comercial con servicios, entregables, tiempos, conceptos y valores.",recibo:"Constancia de un pago recibido con su referencia y concepto.",ficha:"Registro completo del cliente y del proyecto.",acta:"Registro de entrega, pendientes, observaciones y aceptación."};
const SERVICES={
landing:{label:"Landing / web sencilla",scope:"Sitio web informativo de una sola página, optimizado para móvil y con publicación en la infraestructura acordada.",deliver:["Diseño y estructura de la landing","Contenido suministrado por el cliente","Formulario o canal de contacto","Publicación y revisión final"],timeline:"5–10 días hábiles",support:"Mantenimiento básico y correcciones del alcance acordado"},
corporate:{label:"Web empresarial",scope:"Sitio web corporativo de varias secciones para presentar la empresa, servicios, contacto y presencia digital.",deliver:["Arquitectura y páginas acordadas","Diseño responsive","Formularios y enlaces de contacto","SEO básico y publicación"],timeline:"7–15 días hábiles",support:"Mantenimiento y ajustes menores según el plan acordado"},
store:{label:"E-commerce",scope:"Tienda virtual con catálogo, flujo de compra y configuración de los servicios de terceros que correspondan.",deliver:["Catálogo y estructura comercial","Carrito y flujo de pedido","Integración de pago acordada","Revisión responsive y publicación"],timeline:"15–30 días hábiles",support:"Soporte, mantenimiento y revisión de integraciones según el alcance"},
app:{label:"Aplicación web",scope:"Aplicación web con usuarios, formularios, paneles o procesos definidos para el negocio.",deliver:["Flujos y pantallas acordadas","Autenticación cuando aplique","Panel o procesos definidos","Pruebas y publicación"],timeline:"2–6 semanas",support:"Mantenimiento y soporte según el plan contratado"},
system:{label:"Sistema a medida",scope:"Sistema web con datos, procesos, CRUD, reportes y roles definidos de acuerdo con las necesidades del cliente.",deliver:["Módulos y procesos acordados","Base de datos y lógica del sistema","Reportes requeridos","Pruebas, respaldo y entrega"],timeline:"3–8 semanas",support:"Mantenimiento, soporte y respaldos según el acuerdo"},
hosting:{label:"Hosting / mantenimiento",scope:"Servicio recurrente de operación, mantenimiento, actualizaciones, respaldos y gestión de infraestructura según lo contratado.",deliver:["Alojamiento / infraestructura acordada","Mantenimiento recurrente","Copias de seguridad","Soporte básico y revisión"],timeline:"Servicio recurrente",support:"Soporte y mantenimiento durante la vigencia"},
custom:{label:"Servicio personalizado",scope:"Servicio digital definido específicamente para el cliente y documentado en este formulario.",deliver:["Alcance 1 definido por AMS y el cliente","Alcance 2 definido por AMS y el cliente","Revisión y entrega acordadas"],timeline:"Según planificación",support:"Según el alcance y la modalidad contratada"}
};
const params=new URLSearchParams(location.search), initialType=params.get("tipo")||"propuesta";
const type=TYPE_NAMES[initialType]?initialType:"propuesta";
let clients=[],items=[{description:"",qty:1,unit:"",price:0}];
const ISSUERS={"Diego Andrés Avila Ríos":{name:"Diego Andrés Avila Ríos",id:"CC 1235241572",email:"equipo@avilamorasoluciones.com",phone:"+57 305 254 7072",country:"Colombia"},"María José Mora Martínez":{name:"María José Mora Martínez",id:"CE 7337048",email:"equipo@avilamorasoluciones.com",phone:"+57 305 254 7072",country:"Colombia"}};const defaultIssuer={name:"",id:"",email:"equipo@avilamorasoluciones.com",phone:"+57 305 254 7072",address:"",country:"Colombia"};
function read(k,d=[]){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function val(id){const e=$(id);return e?String(e.value||"").trim():""}
function money(n,c){return (c||"USD")+" "+Number(n||0).toLocaleString("es-CO",{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtDate(v){if(!v)return "-";const d=new Date(v+"T12:00:00");return d.toLocaleDateString("es-CO",{year:"numeric",month:"long",day:"numeric"})}
function today(){return new Date().toISOString().slice(0,10)}
function numberFor(t){const k="ams_doc_counter_v3_"+t,n=Number(localStorage.getItem(k)||0)+1;localStorage.setItem(k,String(n));return "AMS-"+t.slice(0,3).toUpperCase()+"-"+String(n).padStart(4,"0")}
function profileKey(){return "ams_doc_profile_"+encodeURIComponent(val("issuerName")||"default")}
function loadProfiles(){return read("ams_doc_profiles_v3",[])}
function saveIssuer(){const x={name:val("issuerName"),id:val("issuerId"),email:val("issuerEmail"),phone:val("issuerPhone"),address:val("issuerAddress")};if(!x.name){setStatus("Selecciona o escribe el nombre del prestador antes de guardar.");return}const all=loadProfiles().filter(p=>p.name!==x.name);all.push(x);save("ams_doc_profiles_v3",all);setStatus("Datos del prestador guardados para futuros documentos.")}
function loadIssuer(){const name=val("issuerName"),preset=ISSUERS[name],x=loadProfiles().find(p=>p.name===name),d=x||preset||Object.assign({},defaultIssuer,{name:name});$("issuerId").value=d.id||"";$("issuerEmail").value=d.email||defaultIssuer.email;$("issuerPhone").value=d.phone||defaultIssuer.phone;$("issuerAddress").value=d.address||"";}
function mergeClients(){const a=read("ams_subscriptions_v1",[]).map(c=>({source:"Suscripción",company:c.company||"",contact:c.contact||"",email:c.email||"",phone:c.phone||"",country:c.country||"",city:c.city||"",address:c.address||"",domain:c.domain||"",url:c.url||"",hosting:c.hosting||"",service:c.webType||"",price:c.price||0,currency:c.currency||"USD",period:c.period||"monthly",due:c.due||"",project:"",notes:""}));const b=read("ams_ops_projects_v1",[]).map(c=>({source:"Operación",company:c.client||"",contact:"",email:c.email||"",phone:c.phone||"",country:"",city:"",address:"",domain:c.domain||"",url:c.url||"",hosting:"",service:c.service||"",price:c.price||0,currency:c.currency||"USD",period:"",due:"",project:c.project||"",notes:c.notes||""}));const map=new Map;[...a,...b].forEach(c=>{const k=(c.email||c.company).toLowerCase().trim();if(!k)return;if(!map.has(k))map.set(k,c);else{const x=map.get(k);Object.keys(c).forEach(q=>{if(!x[q]&&c[q])x[q]=c[q]})}});clients=[...map.values()].sort((x,y)=>x.company.localeCompare(y.company,"es"));return clients}
function fillClient(c){if(!c)return;$("clientName").value=c.company||"";$("clientId").value=$("clientId").value||"";$("clientEmail").value=c.email||"";$("clientPhone").value=c.phone||"";$("clientCountry").value=c.country||"Colombia";$("clientCity").value=c.city||"";$("clientAddress").value=c.address||"";$("domain").value=c.domain||"";$("website").value=c.url||"";$("hosting").value=c.hosting||"";$("project").value=c.project||"";if(c.service&&$("serviceKey")){const s=String(c.service).toLowerCase(),map=s.includes("e-commerce")||s.includes("tienda")?"store":s.includes("sistema")?"system":s.includes("aplic")?"app":s.includes("empresa")||s.includes("corpor")?"corporate":s.includes("hosting")||s.includes("mantenimiento")?"hosting":s.includes("landing")||s.includes("sencilla")||s.includes("web")?"landing":"custom";$("serviceKey").value=map}if($("currency"))$("currency").value=c.currency||$("currency").value;if(c.price&&$("recurringFee"))$("recurringFee").value=c.price;applyService(false)}
function setStatus(s){$("status").textContent=s;setTimeout(()=>{if($("status").textContent===s)$("status").textContent=""},3800)}
function selectedService(){return SERVICES[val("serviceKey")]||SERVICES.custom}
function applyService(force=true){const s=selectedService();if(force||!val("scope"))$("scope").value=s.scope;if(force||!val("deliverables"))$("deliverables").value=s.deliver.join("\n");if(force||!val("timeline"))$("timeline").value=s.timeline;if($("support")&&(force||!val("support")))$("support").value=s.support;if($("serviceName")&&(force||!val("serviceName")))$("serviceName").value=s.label;render()}
function lineItemsHtml(){return '<div id="items" class="items">'+items.map((x,i)=>'<div class="item-row"><input class="input line-desc" data-i="'+i+'" value="'+esc(x.description)+'" placeholder="Concepto / entregable"><input class="input line-qty" data-i="'+i+'" type="number" min="1" step="1" value="'+(x.qty||1)+'"><input class="input line-price" data-i="'+i+'" type="number" min="0" step="0.01" value="'+(x.price||0)+'" placeholder="Valor"><button class="xbtn" data-rm="'+i+'" title="Quitar">×</button></div>').join("")+'</div><button class="chip add-row" id="addItem" type="button">＋ Agregar concepto</button>'}
function commonForm(extra){const prof=loadProfiles();const noClient=false,noIssuer=false;return '<div class="section" style="border-top:0;padding-top:0;margin-top:0"><h3>1. Documento</h3><div class="grid"><div class="field"><label>Tipo</label><select id="docType">'+Object.entries(TYPE_NAMES).map(([k,v])=>'<option value="'+k+'" '+(k===type?"selected":"")+'>'+v+'</option>').join("")+'</select></div><div class="field"><label>N.º documento</label><input id="number" value="'+esc(numberFor(type))+'"></div><div class="field"><label>Fecha</label><input id="date" type="date" value="'+today()+'"></div>'+(!noIssuer?'<div class="field"><label>Responsable AMS</label><select id="issuerName"><option value="">Seleccionar</option><option value="Diego Andrés Avila Ríos">Diego Andrés Avila Ríos · CC 1235241572</option><option value="María José Mora Martínez">María José Mora Martínez · CE 7337048</option>'+prof.filter(p=>p.name&&!["Diego Andrés Avila Ríos","María José"].includes(p.name)).map(p=>'<option>'+esc(p.name)+'</option>').join("")+'</select></div><div class="field"><label>Identificación</label><input id="issuerId"></div><div class="field"><label>Correo AMS</label><input id="issuerEmail" type="email" value="'+defaultIssuer.email+'"></div><div class="field"><label>Teléfono AMS</label><input id="issuerPhone" value="'+defaultIssuer.phone+'"></div><div class="field full"><label>Dirección / ciudad del prestador</label><input id="issuerAddress"></div>':'')+'</div></div>'+(!noClient?'<div class="section"><h3>2. Cliente y proyecto</h3><div class="grid"><div class="field full"><label>Cliente existente</label><select id="clientRef"><option value="">Seleccionar para autocompletar</option>'+mergeClients().map((c,i)=>'<option value="'+i+'">'+esc(c.company||"Cliente")+(c.email?" · "+esc(c.email):"")+'</option>').join("")+'</select></div><div class="field"><label>Nombre / empresa</label><input id="clientName"></div><div class="field"><label>Identificación</label><input id="clientId" placeholder="NIT / documento"></div><div class="field"><label>Correo</label><input id="clientEmail" type="email"></div><div class="field"><label>Teléfono / WhatsApp</label><input id="clientPhone"></div><div class="field"><label>País</label><input id="clientCountry" value="Colombia"></div><div class="field"><label>Ciudad</label><input id="clientCity"></div><div class="field"><label>Dirección</label><input id="clientAddress"></div><div class="field"><label>Dominio</label><input id="domain"></div><div class="field"><label>URL</label><input id="website"></div><div class="field"><label>Infraestructura / hosting</label><input id="hosting"></div><div class="field"><label>Proyecto</label><input id="project"></div></div></div>':'')+extra+'<div class="actions"><button class="btn primary" id="pdfBtn" type="button">Generar PDF</button><button class="btn green" id="shareBtn" type="button">Compartir PDF</button><button class="btn" id="saveBtn" type="button">Guardar borrador</button><button class="btn" id="printBtn" type="button">Imprimir</button><button class="btn warn" id="clearBtn" type="button">Nuevo</button></div><div class="status" id="status"></div><div class="note"><strong>Plantilla:</strong> el formulario cambia según el documento y puede tomar automáticamente los datos del cliente, del servicio y del prestador. El contenido final debe revisarse antes de firmar o entregar.</div>'}

function loadDraft(){const d=read(draftKey(),null);if(!d)return;qsa("input,select,textarea",$("formPanel")).forEach(e=>{if(d[e.id]!==undefined)e.value=d[e.id]});if(Array.isArray(d.items))items=d.items;rebuildLineItems();render()}
function collectClient(){const c={company:val("clientName"),email:val("clientEmail"),phone:val("clientPhone"),country:val("clientCountry"),city:val("clientCity"),address:val("clientAddress"),domain:val("domain"),url:val("website"),hosting:val("hosting"),webType:val("serviceName"),project:val("project"),price:val("recurringFee")||val("initialFee")||val("amount")||0,currency:val("currency")||"USD"};return c}
async function makePdf(){const {jsPDF}=window.jspdf,paper=$("paper"),clone=paper.cloneNode(true);clone.style.width="760px";clone.style.position="fixed";clone.style.left="-100000px";clone.style.top="0";clone.style.boxShadow="none";clone.style.borderRadius="0";clone.style.minHeight="0";clone.style.padding="38px";clone.style.color="#172033";document.body.appendChild(clone);const pdf=new jsPDF({unit:"mm",format:"a4",orientation:"portrait"});await new Promise((resolve)=>pdf.html(clone,{x:10,y:10,width:190,windowWidth:760,autoPaging:"text",margin:[10,10,14,10],html2canvas:{scale:1.35,useCORS:true,backgroundColor:"#fff",logging:false},callback:doc=>resolve(doc)}));clone.remove();const pages=pdf.internal.getNumberOfPages();for(let i=1;i<=pages;i++){pdf.setPage(i);pdf.setFontSize(7);pdf.setTextColor(123,132,148);pdf.text("AMS · "+documentTitle(),10,288);pdf.text("Página "+i+" / "+pages,195,288,{align:"right"})}return pdf}
async function exportPdf(){try{const pdf=await makePdf(),name=(val("number")||"AMS-documento")+".pdf";pdf.save(name);saveDraft();setStatus("PDF generado: "+name)}catch(e){console.error(e);setStatus("No se pudo generar el PDF.")}}
async function sharePdf(){try{const pdf=await makePdf(),blob=pdf.output("blob"),file=new File([blob],(val("number")||"AMS-documento")+".pdf",{type:"application/pdf"});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:documentTitle(),files:[file]});setStatus("PDF listo para compartir.")}else{pdf.save(file.name);setStatus("El navegador no permite compartir directamente; se descargó el PDF.")}}catch(e){setStatus("No se pudo compartir el PDF.")}}
