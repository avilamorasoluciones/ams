<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050816">
<meta name="robots" content="noindex,follow">
<title>404 | Avila Mora Soluciones</title>
<style>
:root{--bg:#050816;--panel:#0a1123;--text:#f8fbff;--muted:#aab7cf;--cyan:#28d8ff;--violet:#7b6dff;--pink:#ff55b9;--line:rgba(255,255,255,.10)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 15% 10%,rgba(40,216,255,.10),transparent 30%),radial-gradient(circle at 85% 8%,rgba(255,85,185,.10),transparent 28%),linear-gradient(180deg,#040611,#050816 55%,#080b18);color:var(--text);font-family:Montserrat,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
body{min-height:100vh;display:grid;place-items:center;overflow-x:hidden}.page{width:min(1120px,100%);padding:18px}
.card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,rgba(11,18,36,.96),rgba(5,9,22,.95));box-shadow:0 30px 90px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)}
.inner{position:relative;z-index:2;padding:clamp(24px,5vw,54px);text-align:center}.brand{display:inline-flex;align-items:center;gap:11px;color:#fff;text-decoration:none;font-weight:900}.brand img{width:40px;height:40px;filter:drop-shadow(0 0 16px rgba(123,109,255,.45))}
.kicker{margin:16px 0 0;color:#89e7ff;font-size:.72rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.code{margin:18px 0 6px;font-size:clamp(7rem,24vw,15rem);line-height:.78;font-weight:900;letter-spacing:-.10em;background:linear-gradient(100deg,var(--cyan),#6676ff 44%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.title{margin:22px 0 8px;font-size:clamp(1.5rem,4vw,2.4rem);font-weight:900;letter-spacing:-.035em}.text{margin:0 auto;max-width:630px;color:var(--muted);font-size:1rem;line-height:1.6}
.art{margin:28px auto 24px;max-width:900px;border:1px solid rgba(255,255,255,.08);border-radius:22px;overflow:hidden;background:#030611;box-shadow:0 22px 60px rgba(0,0,0,.38)}.art img{display:block;width:100%;height:auto}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 17px;border-radius:12px;border:1px solid rgba(255,255,255,.12);font-weight:900;text-decoration:none}.primary{background:linear-gradient(100deg,var(--cyan),#786fff);color:#06101c;border:0}.secondary{background:rgba(255,255,255,.035);color:#fff}.footer{margin-top:22px;color:#71809a;font-size:.72rem}
@media(max-width:600px){.page{padding:10px}.inner{padding:24px 14px 28px}.art{border-radius:17px}.text{font-size:.92rem}}
</style>
<script>
(function(){
"use strict";
if(window.location.hostname.toLowerCase()!=="avilamorasoluciones.github.io")return;
var u=new URL(window.location.href),p=u.pathname;
if(p==="/ams")p="/";else if(p.indexOf("/ams/")===0)p=p.slice(4)||"/";
u.protocol="https:";u.hostname="avilamorasoluciones.com";u.port="";u.pathname=p;window.location.replace(u.href);
})();
</script>
</head>
<body>
<div class="page"><main class="card"><div class="inner">
<a class="brand" href="/"><img src="/img/ams-icon-192.png?v=20" alt="" aria-hidden="true"><span>Avila Mora Soluciones</span></a>
<div class="kicker">Señal no encontrada</div>
<div class="code" aria-label="Error 404">404</div>
<h1 class="title">Esta página no existe.</h1>
<p class="text">La dirección que buscas no está disponible. El resto de Avila Mora Soluciones sigue aquí.</p>
<div class="art"><img src="/img/ams-system-unified.svg?v=404-1" alt="Identidad visual de Avila Mora Soluciones"></div>
<div class="actions"><a class="btn primary" href="/">Volver a Avila Mora Soluciones</a><a class="btn secondary" href="/#servicios">Ver soluciones</a></div>
<div class="footer">Desarrollo web · sistemas · tiendas · herramientas digitales</div>
</div></main></div>
</body>
</html>
