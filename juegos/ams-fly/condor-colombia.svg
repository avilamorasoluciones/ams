<path d="M105 75c18-12 38-16 58-12-19 5-33 12-45 25z" fill="#94a3b8" opacity=".72"/>
<!-- cuerpo -->
<path d="M65 103c10-18 28-27 47-24 16 2 27 11 34 25-8 19-24 30-43 31-19 1-32-9-38-32z" fill="url(#chest)"/>
<path d="M73 107c11-11 25-16 39-15 10 1 19 5 26 12-11 9-23 14-36 15-11 0-21-4-29-12z" fill="url(#flag)" opacity=".9"/>
