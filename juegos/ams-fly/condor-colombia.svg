<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-labelledby="title desc">
<title id="title">Cóndor de los Andes de Colombia</title>
<desc id="desc">Ilustración estilizada de un cóndor de los Andes con detalles inspirados en Colombia.</desc>
<defs>
  <linearGradient id="bg" x1="18" y1="12" x2="174" y2="180" gradientUnits="userSpaceOnUse">
    <stop stop-color="#17133a"/><stop offset=".55" stop-color="#0b0920"/><stop offset="1" stop-color="#060713"/>
  </linearGradient>
  <linearGradient id="wing" x1="28" y1="70" x2="164" y2="128" gradientUnits="userSpaceOnUse">
    <stop stop-color="#111827"/><stop offset=".55" stop-color="#475569"/><stop offset="1" stop-color="#94a3b8"/>
  </linearGradient>
  <linearGradient id="chest" x1="72" y1="92" x2="124" y2="142" gradientUnits="userSpaceOnUse">
    <stop stop-color="#f8fafc"/><stop offset=".55" stop-color="#e2e8f0"/><stop offset="1" stop-color="#94a3b8"/>
  </linearGradient>
  <linearGradient id="flag" x1="82" y1="112" x2="113" y2="140" gradientUnits="userSpaceOnUse">
    <stop stop-color="#facc15"/><stop offset=".48" stop-color="#facc15"/><stop offset=".49" stop-color="#2563eb"/><stop offset="1" stop-color="#2563eb"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="192" height="192" rx="48" fill="url(#bg)"/>
<circle cx="96" cy="94" r="67" fill="#8b5cf6" opacity=".08"/>
<path d="M18 105c27-38 57-55 91-54 28 1 50 13 66 34-29-9-54-7-75 7-22 15-45 20-82 13z" fill="#8b5cf6" opacity=".13" filter="url(#glow)"/>
