<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Generador documental | AMS</title><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/svg2pdf.js@2.2.4/dist/svg2pdf.umd.min.js"></script><style>:root{--bg:#070b12;--p:#10182a;--m:#9ca9bd;--a:#c7a1ff;--l:#ffffff14}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#8b5cf626,transparent 30%),var(--bg);color:#f7f8fb;font:13px system-ui,Arial}.top{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--l);background:#070b12e8;position:sticky;top:0}.top a{color:#fff;text-decoration:none;font-weight:900}.wrap{max-width:1100px;margin:auto;padding:24px 14px 50px}.layout{display:grid;grid-template-columns:1fr 390px;gap:15px}.panel{background:linear-gradient(145deg,#111b2f,#0b1322);border:1px solid var(--l);border-radius:18px;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;color:var(--m);font-size:9px;font-weight:800;text-transform:uppercase;margin-bottom:5px}input,textarea,select{width:100%;background:#080f1c;color:#fff;border:1px solid #ffffff18;border-radius:9px;padding:10px;font:inherit}textarea{min-height:75px;resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}.btn{border:1px solid #ffffff18;background:#ffffff08;color:#fff;border-radius:9px;padding:10px 12px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,#decaff,#8b5cf6);color:#160e22;border:0}.preview{background:#fff;color:#172033;border-radius:6px;padding:28px;min-height:650px}.ph{display:flex;justify-content:space-between;border-bottom:2px solid #eee;padding-bottom:15px}.ph h2{margin:0;font-size:20px}.meta{color:#667085;font-size:9px}.section{margin-top:20px}.label{color:#7b8494;font-size:8px;letter-spacing:.12em}.text{font-size:10px;line-height:1.55;white-space:pre-line}.box{background:#f7f8fa;border:1px solid #e7ebf0;border-radius:8px;padding:10px;font-size:9px;line-height:1.55}.foot{margin-top:35px;padding-top:10px;border-top:1px solid #eee;color:#7b8494;font-size:8px}.status{color:#65e6a4;font-size:10px;margin-top:7px}@media(max-width:850px){.layout{grid-template-columns:1fr}.preview{order:-1}}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.preview{padding:22px}.ph{display:block}.ph h2{margin-top:10px}}@media print{.top,.form,.actions,.status{display:none}.wrap{padding:0}.layout{display:block}.preview{box-shadow:none;border-radius:0}}</style><link rel="icon" href="../../img/ams-favicon.svg?v=7" type="image/svg+xml" />
</head><body><svg id="pdfLogo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" style="display:none"><defs><linearGradient id="lgpdf" x1="0" x2="1"><stop stop-color="#d8c3ff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect x="4" y="4" width="56" height="56" rx="17" fill="#f5f3ff" stroke="#e9ddff"/><path d="M14 44 25 18h7l11 26h-7l-2.4-6H23.4L21 44h-7Zm12-12h5.2L28.6 25 26 32Z" fill="url(#lgpdf)"/><path d="M42 18h7v26h-7z" fill="#172033"/></svg><header class="top"><a href="centro.html">← Centro documental AMS</a><a href="../index.html">Suscripciones</a></header><main class="wrap"><div class="layout"><section class="panel form"><h1 id="heading">Documento</h1><div class="grid"><div><label>N.º</label><input id="num" placeholder="AMS-0001"></div><div><label>Fecha</label><input id="date" type="date"></div><div><label>Prestador</label><input id="issuer" placeholder="Responsable AMS"></div><div><label>Identificación</label><input id="issuerId" placeholder="Cédula / NIT"></div><div class="full"><label>Correo</label><input id="issuerEmail"></div><div><label>Cliente / empresa</label><input id="client"></div><div><label>Correo cliente</label><input id="clientEmail"></div><div><label>País</label><input id="country" value="Colombia"></div><div><label>Identificación cliente</label><input id="clientId"></div><div class="full"><label id="serviceLabel">Servicio / alcance</label><textarea id="service"></textarea></div><div><label>Valor</label><input id="amount" type="number" value="25"></div><div><label>Moneda</label><select id="currency"><option>USD</option><option>COP</option><option>EUR</option></select></div><div><label>Periodo / fecha</label><input id="period"></div><div><label>Referencia</label><input id="ref"></div><div class="full"><label id="extraLabel">Condiciones</label><textarea id="extra"></textarea></div><div class="full"><label>Pago / soporte / observaciones</label><textarea id="payment"></textarea></div></div><div class="actions"><button class="btn primary" id="pdf">Generar PDF</button><button class="btn" id="share">Compartir</button><button class="btn" id="mail">Correo</button><button class="btn" onclick="print()">Imprimir</button></div><div class="status" id="status"></div></section><section class="panel"><article class="preview" id="preview"><div class="ph"><div><strong>AVILA MORA SOLUCIONES</strong><div class="meta">Soluciones digitales</div></div><div><h2 id="pTitle">DOCUMENTO</h2><div class="meta" id="pMeta">AMS-0001</div></div></div><div class="section"><div class="label">CLIENTE</div><div class="text" id="pClient">—</div></div><div class="section"><div class="label" id="pServiceLabel">SERVICIO</div><div class="text" id="pService">—</div></div><div class="section"><div class="label">VALOR</div><div class="text" id="pAmount">USD 25.00</div></div><div class="section box"><strong id="pExtraLabel">CONDICIONES</strong><br><span id="pExtra">—</span></div><div class="section box"><strong>PAGO / SOPORTE</strong><br><span id="pPayment">—</span></div><div class="foot">Avila Mora Soluciones · Documento comercial generado internamente.<br><span id="pLegal"></span></div></article></section></div></main><script>const qs=new URLSearchParams(location.search),tipo=qs.get("tipo")||"propuesta";const cfg={propuesta:["Propuesta comercial","PROPUESTA COMERCIAL","Servicio / alcance","Condiciones de la propuesta","Documento comercial. No es factura electrónica DIAN."],recibo:["Recibo de pago","RECIBO DE PAGO","Concepto pagado","Referencia del pago","Constancia comercial del pago recibido; conservar con el soporte."],acta:["Acta de entrega","ACTA DE ENTREGA","Entregables","Observaciones y aceptación","Acta comercial de entrega. Ajustar al alcance realmente pactado."],acuerdo:["Acuerdo de servicio","ACUERDO DE SERVICIO","Servicio contratado","Condiciones pactadas","Plantilla comercial; revisar jurídicamente cuando el proyecto lo requiera."]}[tipo]||null;if(!cfg)const mailto="centro.html";const $=id=>document.getElementById(id);const today=new Date().toISOString().slice(0,10);$("date").value=today;$("heading").textContent=cfg[0];$("pTitle").textContent=cfg[1];$("serviceLabel").textContent=cfg[2];$("pServiceLabel").textContent=cfg[2];$("extraLabel").textContent=cfg[3];$("pExtraLabel").textContent=cfg[3];$("pLegal").textContent=cfg[4];function money(v){return new Intl.NumberFormat("es-CO",{minimumFractionDigits:2,maximumFractionDigits:2}).format(+v||0)}function data(){return{num:$("num").value||"AMS-0001",date:$("date").value||today,issuer:$("issuer").value,issuerId:$("issuerId").value,issuerEmail:$("issuerEmail").value,client:$("client").value,clientEmail:$("clientEmail").value,country:$("country").value,clientId:$("clientId").value,service:$("service").value,amount:+$("amount").value||0,currency:$("currency").value,period:$("period").value,ref:$("ref").value,extra:$("extra").value,payment:$("payment").value}}function update(){let d=data();$("pMeta").textContent=d.num+" · "+d.date;$("pClient").textContent=[d.client,d.clientId,d.clientEmail,d.country].filter(Boolean).join(" · ")||"—";$("pService").textContent=d.service||"—";$("pAmount").textContent=d.currency+" "+money(d.amount)+(d.period?" · "+d.period:"");$("pExtra").textContent=d.extra||"—";$("pPayment").textContent=[d.payment,d.ref?"Ref. "+d.ref:""].filter(Boolean).join(" · ")||"—"}document.querySelectorAll("input,textarea,select").forEach(x=>x.addEventListener("input",update));function make(){const d=data(),{jsPDF}=window.jspdf,p=new jsPDF({unit:"mm",format:"a4"});p.setFillColor(18,13,32);p.rect(0,0,210,28,"F");p.setTextColor(255,255,255);p.setFontSize(17);p.text("AVILA MORA SOLUCIONES",36,13);if(p.svg){p.svg(document.getElementById("pdfLogo"),{x:15,y:4,width:16,height:16});}p.setFontSize(14);p.text(cfg[1],195,13,{align:"right"});p.setFontSize(8);p.text(d.num+" · "+d.date,195,20,{align:"right"});let y=40;p.setTextColor(40,48,62);p.setFontSize(9);p.text("CLIENTE",15,y);p.text([d.client,d.clientId,d.clientEmail,d.country].filter(Boolean).join(" · ").slice(0,105)||"—",15,y+6);y+=20;p.setTextColor(120,130,145);p.setFontSize(8);p.text(cfg[2].toUpperCase(),15,y);p.setTextColor(40,48,62);p.setFontSize(10);p.text(p.splitTextToSize(d.service||"—",180),15,y+7);y+=25;p.setTextColor(120,130,145);p.setFontSize(8);p.text("VALOR",15,y);p.setTextColor(40,48,62);p.setFontSize(15);p.text(d.currency+" "+money(d.amount),15,y+8);if(d.period){p.setFontSize(8);p.text(d.period,15,y+15)}y+=30;p.setFillColor(248,250,252);p.rect(15,y,180,35,"F");p.setTextColor(80,90,105);p.setFontSize(8);p.text(cfg[3].toUpperCase(),18,y+7);p.setTextColor(45,55,70);p.text(p.splitTextToSize(d.extra||"—",172),18,y+13);y+=45;p.setFillColor(248,250,252);p.rect(15,y,180,30,"F");p.setTextColor(80,90,105);p.text("PAGO / SOPORTE",18,y+7);p.setTextColor(45,55,70);p.text(p.splitTextToSize([d.payment,d.ref?"Referencia: "+d.ref:""].filter(Boolean).join("\n")||"—",172),18,y+13);p.setTextColor(125,135,148);p.setFontSize(7);p.text(cfg[4],15,276);return p}$("pdf").onclick=()=>{let p=make();p.save(data().num+".pdf");$("status").textContent="PDF generado."};$("share").onclick=async()=>{let p=make(),b=p.output("blob"),f=new File([b],data().num+".pdf",{type:"application/pdf"});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({title:cfg[1],files:[f]});else p.save(data().num+".pdf")};$("mail").onclick=()=>{let d=data();location.href="mailto:"+(d.clientEmail||"")+"?subject="+encodeURIComponent(cfg[1]+" "+d.num+" · Avila Mora Soluciones")+"&body="+encodeURIComponent("Hola "+(d.client||"")+"\n\nTe comparto el documento "+d.num+" de Avila Mora Soluciones.\n\nSaludos.")};window.open(mailto,"_blank");update();</script><script src="../../contacto.js?v=20260927-2"></script>
